<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon univers AYA — Ouvrir l'application</title>
    <meta name="description" content="Scannez vos codes QR AYA, collectez des points et gagnez des récompenses.">
    <meta property="og:title" content="Mon univers AYA">
    <meta property="og:description" content="Ouvrez l'application pour valider votre code QR.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #488950 0%, #5BA863 50%, #3D7344 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { font-size: 15px; opacity: 0.95; margin-bottom: 28px; line-height: 1.5; }
        .spinner {
            width: 28px; height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .download-buttons { display: flex; flex-direction: column; gap: 12px; }
        .download-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 14px 18px;
            background: white; color: #488950;
            text-decoration: none; border-radius: 12px;
            font-weight: 600; font-size: 15px;
        }
        .hint { margin-top: 18px; font-size: 13px; opacity: 0.85; }
        noscript .download-buttons { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mon univers AYA</h1>
        <p class="subtitle" id="status">Ouverture de l'application…</p>
        <div id="loading" class="spinner"></div>
        <div class="download-buttons">
            <a id="android-btn" class="download-btn" href="https://play.google.com/store/apps/details?id=com.uborasoftware.aya">Télécharger sur Google Play</a>
            <a id="ios-btn" class="download-btn" href="https://apps.apple.com/us/app/ayamonunivers/id6757622625">Télécharger sur l'App Store</a>
        </div>
        <p class="hint">Si rien ne s'ouvre, téléchargez l'application puis rescanniez le QR.</p>
        <noscript>
            <p class="hint">JavaScript est désactivé. Choisissez votre store ci-dessus.</p>
        </noscript>
    </div>
    <script>
        (function () {
            var PLAY = 'https://play.google.com/store/apps/details?id=com.uborasoftware.aya';
            var APPSTORE = 'https://apps.apple.com/us/app/ayamonunivers/id6757622625';
            var PACKAGE = 'com.uborasoftware.aya';
            var params = new URLSearchParams(window.location.search);
            var qrCode = params.get('code') || '{{ qr_code|default:""|escapejs }}';
            var ua = navigator.userAgent || '';
            var isAndroid = /android/i.test(ua);
            var isIOS = /iPad|iPhone|iPod/i.test(ua);
            var appOpened = false;
            var storeTimer = null;

            document.getElementById('android-btn').href = PLAY;
            document.getElementById('ios-btn').href = APPSTORE;

            function markOpened() {
                appOpened = true;
                if (storeTimer) {
                    clearTimeout(storeTimer);
                    storeTimer = null;
                }
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) markOpened();
            });
            window.addEventListener('pagehide', markOpened);
            window.addEventListener('blur', markOpened);

            function goToStore() {
                if (appOpened) return;
                document.getElementById('status').textContent =
                    "L'application n'est pas installée. Redirection vers le store…";
                if (isAndroid) {
                    window.location.replace(PLAY);
                } else if (isIOS) {
                    window.location.replace(APPSTORE);
                }
            }

            if (isAndroid) {
                document.getElementById('ios-btn').style.display = 'none';
                var intent =
                    'intent://qr?code=' + encodeURIComponent(qrCode) +
                    '#Intent;scheme=aya-huile-app;package=' + PACKAGE +
                    ';S.browser_fallback_url=' + encodeURIComponent(PLAY) +
                    ';end';
                window.location.href = intent;
                storeTimer = setTimeout(goToStore, 2500);
                return;
            }

            if (isIOS) {
                document.getElementById('android-btn').style.display = 'none';
                window.location.href = 'aya-huile-app://qr?code=' + encodeURIComponent(qrCode);
                storeTimer = setTimeout(goToStore, 1800);
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('status').textContent =
                'Téléchargez Mon univers AYA pour valider ce code QR.';
        })();
    </script>
</body>
</html>
